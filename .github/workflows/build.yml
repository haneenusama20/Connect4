name: build exe
on: [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: install
        run: python -m pip install pyinstaller numpy pygame
        shell: bash

      - name: Build exe
        run: pyinstaller --onefile --noconsole --add-data "assets;assets" GUI.py
        shell: bash

      - name: Commit exe to repo
        run: |
          mkdir -p release
          cp dist/GUI.exe release/GUI.exe
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f release/GUI.exe
          git commit -m "Update GUI.exe [skip ci]" || echo "No changes to commit"
          git push
        shell: bash